name: CI

on:
  push:
    branches: [main, "feature/*"]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: gowayki_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_NAME: gowayki_db
      DB_USER: postgres
      DB_PASSWORD: root
      DB_HOST: localhost
      DB_PORT: 5433
      DJANGO_SETTINGS_MODULE: config.settings
      SECRET_KEY: ci-only-secret-key-not-for-production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar cliente de Postgres
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Aplicar esquema
        run: |
          PGPASSWORD=root psql -h localhost -p 5433 -U postgres -d gowayki_db -f scripts/ci/schema.sql

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Check de Django
        run: python manage.py check

      - name: Verificar esquema
        run: python manage.py check_schema

      - name: Tests
        run: python -m pytest -q