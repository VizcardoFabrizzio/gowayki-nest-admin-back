services:
  backend:
    build: .
    container_name: gowayki_nest_admin_back
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/estado')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s